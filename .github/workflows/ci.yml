name: Go CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up development tools
        uses: jdx/mise-action@v4

      - name: Build
        run: mise run build

      - name: Run tests
        run: mise run test

      - name: Run go vet
        run: mise run vet

      - name: Check formatting
        run: mise run format-check

      - name: Run linter
        run: mise run lint-check
