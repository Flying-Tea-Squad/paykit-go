name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up development tools
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Run CI checks
        run: mise run ci
